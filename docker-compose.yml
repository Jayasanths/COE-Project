version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
    environment:
      - DATABASE_URL=sqlite:////app/data/handover.db
      - OLLAMA_URL=http://host.docker.internal:11434
      - SEED=42
    depends_on: []

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    ports:
      - "5173:80"
    depends_on:
      - api
